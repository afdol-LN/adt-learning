# Render Blueprint: deploys the backend API on the free plan.
# Render dashboard → New → Blueprint → pick this repo.
# Values marked `sync: false` are secrets — Render asks for them on first deploy; never commit them.
# The KT-IDEM P(L) update runs inside NestJS (src/libs/bkt/ktIdem.ts). The Python btk-engine is no longer
# deployed; run its calibration by hand: `python server/btk-engine/app/script/calibrate.py` with DATABASE_URL set.
services:
  # NestJS API
  - type: web
    name: adt-api
    runtime: node
    plan: free
    rootDir: server/app
    buildCommand: npm ci && npm run build
    startCommand: node dist/main
    healthCheckPath: /docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false # https://<your-app>.vercel.app
      - key: DATABASE_URL
        sync: false # Supabase *pooler* URL (…pooler.supabase.com), not db.<ref>.supabase.co
      - key: JWT_SECRET
        sync: false
      - key: LLM_CHAIN
        sync: false
      - key: OPENROUTER_MINIMAX_PROVIDER
        sync: false
      - key: OPENROUTER_MINIMAX_BASE_URL
        sync: false
      - key: OPENROUTER_MINIMAX_API_KEY
        sync: false
      - key: OPENROUTER_MINIMAX_MODEL
        sync: false
      - key: OPENROUTER_MINIMAX_TIMEOUT_MS
        sync: false
      - key: DOTBLUE_GEMMA_PROVIDER
        sync: false
      - key: DOTBLUE_GEMMA_BASE_URL
        sync: false
      - key: DOTBLUE_GEMMA_API_KEY
        sync: false
      - key: DOTBLUE_GEMMA_MODEL
        sync: false
      - key: DOTBLUE_GEMMA_TIMEOUT_MS
        sync: false
